[workspace]
resolver = "3"
members = ["crates/vesper-render", "crates/desktopia", "crates/preview"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
