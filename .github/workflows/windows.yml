name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --exclude preview
      - name: Build
        run: cargo build --release -p desktopia
      - uses: actions/upload-artifact@v4
        with:
          name: desktopia
          path: target/release/desktopia.exe
      - name: Publish as the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/release/desktopia.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download desktopia.exe and run it."
