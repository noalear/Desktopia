name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write  # lets the automerge job dispatch the main build

# A new push to a PR cancels its stale build; runs on main queue so the
# "latest" release is always rebuilt from the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --exclude preview
      - name: Build
        run: cargo build --release -p desktopia
      - uses: actions/upload-artifact@v4
        with:
          name: desktopia
          path: target/release/desktopia.exe
      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/release/desktopia.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download desktopia.exe and run it."

  # Merge the PR as soon as its build is green. Drafts and PRs labeled "hold"
  # are left for a manual merge, as are PRs from forks.
  automerge:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    steps:
      - name: Merge and republish "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
          # A merge made with the workflow token doesn't fire the push
          # trigger, so start the main build that publishes the release.
          gh workflow run windows.yml -R "$GITHUB_REPOSITORY" --ref main
