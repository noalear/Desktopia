[package]
name = "desktopia"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Vesper, a living world on the Windows desktop"

[dependencies]
vesper-render = { path = "../vesper-render" }
vesper-sim = { path = "../vesper-sim" }
vesper-terrain = { path = "../vesper-terrain" }
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
vesper-chronicle = { path = "../vesper-chronicle" }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
chronicle-view = { path = "../chronicle-view" }
# DXC compiles the shaders in seconds; Windows' built-in FXC takes over a minute.
wgpu = { workspace = true, features = ["static-dxc"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
