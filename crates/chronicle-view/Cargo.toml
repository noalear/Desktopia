[package]
name = "chronicle-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The chronicle window: Vesper's history, species tree and notable lives"

[dependencies]
vesper-chronicle = { path = "../vesper-chronicle" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "default_fonts"] }
log.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
